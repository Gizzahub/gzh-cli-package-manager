version: "2"

run:
  # Analyze against the public consumer baseline. The lint workflow itself
  # runs with the pinned development toolchain from the CI configuration.
  go: "1.24"
  modules-download-mode: readonly
  tests: true

linters:
  enable:
    - bodyclose
    - cyclop
    - depguard
    - dupl
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - gomodguard_v2
    - gosec
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: Use io or os instead of deprecated io/ioutil
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - paramTypeCombine
      enabled-tags:
        - diagnostic
        - performance
        - style
    gocyclo:
      min-complexity: 15
    godot:
      scope: declarations
      exclude:
        - '^TODO:'
        - '^FIXME:'
    gomodguard_v2:
      blocked:
        - module: github.com/pkg/errors
          recommendations:
            - fmt
            - errors
          reason: Use standard library errors package
    gosec:
      excludes:
        - G104
    govet:
      # fieldalignment is a memory-layout optimisation, not a correctness
      # check. Reordering exported or JSON-facing structs would create broad
      # API and output-order churn without a measured hot-path benefit.
      disable:
        - fieldalignment
      enable-all: true
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: exported
          severity: warning
        - name: package-comments
          severity: warning
        - name: var-naming
          severity: warning
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      # cmdutil helpers already attach operation context. Returning those
      # errors from adapters is a policy exception, not a missing wrap.
      extra-ignore-sigs:
        - github.com/gizzahub/gzh-cli-package-manager/pkg/infrastructure/adapter/manager/cmdutil.CheckResult(
        - github.com/gizzahub/gzh-cli-package-manager/pkg/infrastructure/adapter/manager/cmdutil.UnmarshalJSON(
        - github.com/gizzahub/gzh-cli-package-manager/pkg/infrastructure/adapter/manager/cmdutil.ExtractVersionField(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - revive
          - staticcheck
        path: doc\.go
      - linters:
          - all
        path: .*\.pb\.go
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  # Keep the complete TASK-064 backlog visible until it is remediated.
  new: false

formatters:
  # Without this key golangci-lint v2 runs no formatter at all: the gci settings
  # below were configured but never applied, and `golangci-lint formatters`
  # listed both of these as disabled. Enabling them is what makes `make fmt` and
  # the Lint job actually enforce the import grouping this file describes.
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/gizzahub)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
