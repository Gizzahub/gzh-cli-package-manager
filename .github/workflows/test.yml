name: Test

on:
  push:
    branches: [ master, 'dev/**' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.7']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ matrix.go }}

    - name: Verify Go version
      run: |
        # ADR-009 establishes Go 1.26 as the consumer baseline. The regular
        # test job exercises the latest approved patch release.
        required_major=1
        required_minor=26
        required_patch=0
        installed_go="$(go env GOVERSION)"

        verify_go_version() {
          local candidate="$1"

          # Require a stable Go release. Development builds and prereleases such
          # as go1.26rc1 are intentionally rejected for CI reproducibility.
          if [[ ! "$candidate" =~ ^go(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable Go version (go<major>.<minor>.<patch>); found ${candidate:-<missing>}"
            return 1
          fi

          local installed_major="${BASH_REMATCH[1]}"
          local installed_minor="${BASH_REMATCH[2]}"
          local installed_patch="${BASH_REMATCH[3]}"

          if (( installed_major < required_major || \
                (installed_major == required_major && installed_minor < required_minor) || \
                (installed_major == required_major && installed_minor == required_minor && installed_patch < required_patch) )); then
            echo "Go ${required_major}.${required_minor}.${required_patch}+ required by ADR-009; found $candidate"
            return 1
          fi

          echo "Go $candidate satisfies the ADR-009 minimum (${required_major}.${required_minor}.${required_patch})"
        }

        verify_go_version "$installed_go"

        # Keep the parser and floor comparison covered without relying on a
        # particular runner image. The negative cases must remain rejected.
        for candidate in go1.26.0 go1.26.7 go1.27.0 go2.0.0; do
          verify_go_version "$candidate"
        done
        for candidate in go1.25.99 go1.26rc1 go1.26.bad go1.26.7evil go1.26.7.8; do
          if verify_go_version "$candidate"; then
            echo "Expected Go version validation to reject $candidate"
            exit 1
          fi
        done

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Format check
      run: |
        go fmt ./...
        git diff --exit-code

    - name: Vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # golangci-lint's audited new-from-rev baseline must exist locally.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.7'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        version: v2.13.1
        args: --timeout=5m

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
