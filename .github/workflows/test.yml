name: Test

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.6']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Verify Go version
      run: |
        # ADR-004 guarantees Go 1.24+ throughout the v1.x lifecycle.
        # go.mod currently declares a newer version; reconcile that policy drift
        # in its own change rather than silently changing this support contract.
        required_major=1
        required_minor=24
        required_patch=0
        installed_go="$(go env GOVERSION)"

        verify_go_version() {
          local candidate="$1"

          # Require a stable Go release. Development builds and prereleases such
          # as go1.24rc1 are intentionally rejected for CI reproducibility.
          if [[ ! "$candidate" =~ ^go(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable Go version (go<major>.<minor>.<patch>); found ${candidate:-<missing>}"
            return 1
          fi

          local installed_major="${BASH_REMATCH[1]}"
          local installed_minor="${BASH_REMATCH[2]}"
          local installed_patch="${BASH_REMATCH[3]}"

          if (( installed_major < required_major || \
                (installed_major == required_major && installed_minor < required_minor) || \
                (installed_major == required_major && installed_minor == required_minor && installed_patch < required_patch) )); then
            echo "Go ${required_major}.${required_minor}.${required_patch}+ required by ADR-004; found $candidate"
            return 1
          fi

          echo "Go $candidate satisfies the ADR-004 minimum (${required_major}.${required_minor}.${required_patch})"
        }

        verify_go_version "$installed_go"

        # Keep the parser and floor comparison covered without relying on a
        # particular runner image. The negative cases must remain rejected.
        for candidate in go1.24.0 go1.24.9 go1.26.6 go2.0.0; do
          verify_go_version "$candidate"
        done
        for candidate in go1.23.99 go1.24rc1 go1.26.bad go1.26.6evil go1.26.6.7; do
          if verify_go_version "$candidate"; then
            echo "Expected Go version validation to reject $candidate"
            exit 1
          fi
        done

    - name: Cache Go modules
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Format check
      run: |
        go fmt ./...
        git diff --exit-code

    - name: Vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.txt
        flags: unittests
        name: codecov-${{ matrix.os }}
        # v4 ended tokenless uploads for most repositories. The secret may not be
        # set yet; an empty value behaves exactly as v3 did without one, so this
        # line costs nothing now and is the whole fix once the secret exists.
        token: ${{ secrets.CODECOV_TOKEN }}
        # Coverage reporting is not a merge gate here. Stated explicitly so the
        # upload failing on a missing token cannot start failing the test job if
        # the action ever changes this default.
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.6'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.1
        args: --timeout=5m

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
