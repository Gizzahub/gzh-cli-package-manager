name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          # Windows arm64 not commonly used yet
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.7'

    - name: Get version
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=dev-$(git rev-parse --short HEAD)
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        OUTPUT_NAME=gz-pm-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi

        go build \
          -ldflags "-s -w \
            -X github.com/gizzahub/gzh-cli-package-manager/internal/version.Version=${{ steps.version.outputs.VERSION }} \
            -X github.com/gizzahub/gzh-cli-package-manager/internal/version.GitCommit=$(git rev-parse --short HEAD) \
            -X github.com/gizzahub/gzh-cli-package-manager/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o "build/${OUTPUT_NAME}" \
          ./cmd/pm

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: gz-pm-${{ matrix.goos }}-${{ matrix.goarch }}
        path: build/gz-pm-*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/**/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
