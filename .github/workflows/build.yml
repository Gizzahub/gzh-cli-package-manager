name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Tagless preflight binary version (SemVer without leading v)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify-release-inputs:
    name: Verify release inputs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.7'

    - name: Check release target alignment
      run: ./scripts/release/targets-check.sh

    - name: Check runtime dependency inventory
      run: ./scripts/release/runtime-deps.sh --check

    - name: Check license payload
      run: ./scripts/release/payload-check.sh

  build:
    name: Build
    needs: verify-release-inputs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.7'

    - name: Get version
      id: version
      env:
        GZPM_REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
      run: |
        set -euo pipefail
        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" == refs/tags/* ]]; then
          # The tag branch below wins over the manual input, so a dispatch aimed
          # at a tag would build the tag's version while appearing to honour the
          # requested one. Refuse instead of discarding the operator's input.
          echo "::error::Preflight builds must target a branch. Dispatching at ${GITHUB_REF} would ignore the requested version." >&2
          exit 1
        fi
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          VERSION=$(./scripts/release/validate-version.sh "${GITHUB_REF#refs/tags/v}")
        elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "::error::Release tags must be v-prefixed SemVer; got ${GITHUB_REF}." >&2
          exit 1
        elif [[ -n "${GZPM_REQUESTED_VERSION}" ]]; then
          VERSION=$(./scripts/release/validate-version.sh "${GZPM_REQUESTED_VERSION}")
        else
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi
        echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Build archive
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        OUTPUT_NAME=gz-pm-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi

        mkdir -p build dist
        go build \
          -ldflags "-s -w \
            -X github.com/gizzahub/gzh-cli-package-manager/internal/version.Version=${{ steps.version.outputs.VERSION }} \
            -X github.com/gizzahub/gzh-cli-package-manager/internal/version.GitCommit=$(git rev-parse --short HEAD) \
            -X github.com/gizzahub/gzh-cli-package-manager/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o "build/${OUTPUT_NAME}" \
          ./cmd/gz-pm

        ./scripts/release/package-archive.sh \
          --goos "${{ matrix.goos }}" \
          --goarch "${{ matrix.goarch }}" \
          --binary "build/${OUTPUT_NAME}" \
          --output-dir dist

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: gz-pm-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/gz-pm-${{ matrix.goos }}-${{ matrix.goarch }}.*
        if-no-files-found: error

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: artifacts

    - name: Generate checksums
      run: |
        mkdir -p dist
        ./scripts/release/checksums.sh --input-dir artifacts --output dist/checksums.txt

    - name: Upload checksums
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: checksums
        path: dist/checksums.txt
        if-no-files-found: error

  release:
    name: Release
    needs: [build, checksums]
    runs-on: ubuntu-latest
    # Publishing is restricted to a pushed v-prefixed tag. Matching every
    # refs/tags/* would let a workflow_dispatch aimed at an existing tag re-run
    # this job and overwrite the assets of a release that is already public,
    # which succeeds silently rather than failing loudly.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    # action-gh-release creates a release, which needs write access to repository
    # contents. The default GITHUB_TOKEN is read-only whenever the repository or
    # organization sets default workflow permissions to read, so the release step
    # fails with 403 without this. Declared on the job rather than the workflow so
    # the build job above stays read-only.
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: artifacts

    - name: Create Release
      id: release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
      with:
        files: |
          artifacts/**/*.tar.gz
          artifacts/**/*.zip
          artifacts/**/checksums.txt
        # Create the release as a draft so it is inspected before it is public.
        # A draft can be deleted; a published release may already have been
        # fetched by watchers or polling tooling, and you cannot know which.
        #
        # This does NOT make tagging reversible, and it should not be read as
        # doing so. proxy.golang.org caches a module version from the git tag
        # alone, independent of whether a GitHub release exists at all, and
        # sum.golang.org records its hash permanently. The tag push is the
        # irreversible step; this covers only the release artifacts.
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Report that the release awaits publication
      env:
        RELEASE_URL: ${{ steps.release.outputs.url }}
      run: |
        {
          echo "## Draft release created -- NOT public"
          echo
          echo "${RELEASE_URL}"
          echo
          echo "The artifacts are attached to a **draft**. Drafts are invisible to"
          echo "anyone without push access and absent from the releases list,"
          echo "\`/releases/latest\`, and the unauthenticated API. Nothing is"
          echo "published until a maintainer opens that URL and clicks **Publish"
          echo "release**."
          echo
          echo "Do not create a second release for this tag. GitHub allows one while"
          echo "the first is a draft, which yields a published release with no"
          echo "artifacts beside an invisible draft that has them. Edit and publish"
          echo "the draft above instead."
        } >> "$GITHUB_STEP_SUMMARY"
