name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-inputs:
    name: Verify release inputs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.7'

    - name: Check release target alignment
      run: ./scripts/release/targets-check.sh

    - name: Check runtime dependency inventory
      run: ./scripts/release/runtime-deps.sh --check

    - name: Check license payload
      run: ./scripts/release/payload-check.sh

  build:
    name: Build
    needs: verify-release-inputs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.7'

    - name: Get version
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=dev-$(git rev-parse --short HEAD)
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

    - name: Build archive
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        OUTPUT_NAME=gz-pm-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi

        mkdir -p build dist
        go build \
          -ldflags "-s -w \
            -X github.com/gizzahub/gzh-cli-package-manager/internal/version.Version=${{ steps.version.outputs.VERSION }} \
            -X github.com/gizzahub/gzh-cli-package-manager/internal/version.GitCommit=$(git rev-parse --short HEAD) \
            -X github.com/gizzahub/gzh-cli-package-manager/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o "build/${OUTPUT_NAME}" \
          ./cmd/gz-pm

        ./scripts/release/package-archive.sh \
          --goos "${{ matrix.goos }}" \
          --goarch "${{ matrix.goarch }}" \
          --binary "build/${OUTPUT_NAME}" \
          --output-dir dist

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: gz-pm-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/gz-pm-${{ matrix.goos }}-${{ matrix.goarch }}.*
        if-no-files-found: error

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: artifacts

    - name: Generate checksums
      run: |
        mkdir -p dist
        ./scripts/release/checksums.sh --input-dir artifacts --output dist/checksums.txt

    - name: Upload checksums
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: checksums
        path: dist/checksums.txt
        if-no-files-found: error

  release:
    name: Release
    needs: [build, checksums]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    # action-gh-release creates a release, which needs write access to repository
    # contents. The default GITHUB_TOKEN is read-only whenever the repository or
    # organization sets default workflow permissions to read, so the release step
    # fails with 403 without this. Declared on the job rather than the workflow so
    # the build job above stays read-only.
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
      with:
        files: |
          artifacts/**/*.tar.gz
          artifacts/**/*.zip
          artifacts/**/checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
